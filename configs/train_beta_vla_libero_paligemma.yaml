# Beta-VLA with OpenPI-style PaliGemma vision tower (SigLIP only, no DINO)
# Checkpoint incompatible with openvla vision - train from scratch
# PaliGemma is gated: run `huggingface-cli login` and accept license at
# https://huggingface.co/google/paligemma2-3b-pt-224
runtime:
  exp_name: beta_vla_libero_openpi
  checkpoint_base_dir: ./checkpoints
  wandb_project: beta-vla-openpi
  wandb_enabled: true
  seed: 42
  batch_size: 4
  grad_accumulation_steps: 4
  use_amp: true
  num_train_steps: 50000
  log_interval: 10
  save_interval: 5000
  learning_rate: 5e-6
  weight_decay: 0
  num_workers: 8
  resume: false  # PaliGemma vision: incompatible with openvla checkpoint
  resume_from_best: false
  overwrite: true
  grad_clip_norm: 1.0
  warmup_steps: 2000
  lr_schedule: cosine_warmup
  end_lr: 1e-5

data:
  repo_id: physical-intelligence/libero
  split: train
  num_workers: 8
  max_token_len: 128
  max_samples: null
  state_dim: 8
  norm_stats_path: assets/physical-intelligence/libero/norm_stats.json

model:
  action_dim: 7
  action_horizon: 10
  state_dim: 8
  freeze_vision: true  # PaliGemma SigLIP pre-trained for image-text
  freeze_language: false
  freeze_vggt: false
  use_lora: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "up_proj", "down_proj", "gate_proj"]
  lora_target_modules_vggt: ["qkv", "proj", "fc1", "fc2"]
  lora_on_language: true
  lora_on_vggt: true
  vision_tower_type: paligemma
  vision:
    model_name: google/paligemma2-3b-pt-224
    image_size: 224
  language:
    model_name: Qwen/Qwen3-0.6B-Base
    trust_remote_code: true
  vggt:
    model_name: facebook/VGGT-1B
    trust_remote_code: true
