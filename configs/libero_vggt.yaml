runtime:
  exp_name: libero_vggt
  checkpoint_base_dir: ./checkpoints
  wandb_project: beta-vla-libero
  wandb_enabled: true
  seed: 42
  batch_size: 16           # per GPU (16 * 4 GPUs = 64 effective)
  grad_accumulation_steps: 1
  use_amp: true
  num_train_steps: 30000
  log_interval: 20
  save_interval: 1000
  learning_rate: 2.5e-5
  weight_decay: 0.0
  num_workers: 4
  resume: false
  resume_from_best: false
  overwrite: true
  grad_clip_norm: 1.0
  warmup_steps: 1000
  lr_schedule: cosine_warmup
  end_lr: 2.5e-6

data:
  repo_id: physical-intelligence/libero
  split: train
  num_workers: 4
  max_token_len: 128
  max_samples: null
  state_dim: 8
  norm_stats_path: assets/physical-intelligence/libero/norm_stats.json

model:
  action_dim: 7
  action_horizon: 10
  state_dim: 8
  gripper_loss_weight: 5.0
  freeze_vision: true          # PaliGemma SigLIP: frozen (pretrained, image-text aligned)
  freeze_language: false       # Qwen: LoRA fine-tune
  freeze_vggt: false           # VGGT: LoRA fine-tune
  use_lora: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "up_proj", "down_proj", "gate_proj"]
  lora_target_modules_vggt: ["qkv", "proj", "fc1", "fc2"]
  lora_on_language: true
  lora_on_vggt: true
  vision:
    model_name: google/paligemma2-3b-pt-224
    image_size: 224
  language:
    model_name: Qwen/Qwen3-0.6B-Base
    trust_remote_code: true
  vggt:
    model_name: facebook/VGGT-1B
    trust_remote_code: true
