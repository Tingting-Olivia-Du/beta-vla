runtime:
  exp_name: beta_vla_libero
  checkpoint_base_dir: ./checkpoints
  wandb_project: beta-vla
  wandb_enabled: true
  seed: 42
  batch_size: 2
  grad_accumulation_steps: 2
  use_amp: true
  num_train_steps: 10000
  log_interval: 10
  save_interval: 3000
  learning_rate: 5e-5
  weight_decay: 0.0
  num_workers: 8
  resume: false
  overwrite: false
  grad_clip_norm: 1.0

data:
  repo_id: physical-intelligence/libero
  split: train
  num_workers: 8
  max_token_len: 128
  max_samples: 2

model:
  action_dim: 7
  action_horizon: 10
  freeze_vision: false
  freeze_language: false
  freeze_vggt: false
  use_lora: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "up_proj", "down_proj", "gate_proj"]
  lora_target_modules_vggt: ["qkv", "proj", "fc1", "fc2"]
  lora_on_language: true
  lora_on_vggt: true
  vision:
    dino_model_name: vit_large_patch14_reg4_dinov2.lvd142m
    siglip_model_name: vit_so400m_patch14_siglip_224
    image_size: 224
  language:
    model_name: Qwen/Qwen3-0.6B-Base
    trust_remote_code: true
  vggt:
    model_name: facebook/VGGT-1B
    trust_remote_code: true
