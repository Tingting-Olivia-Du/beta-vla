runtime:
  exp_name: beta_vla_libero
  checkpoint_base_dir: ./checkpoints
  wandb_project: beta-vla-0307
  wandb_enabled: true
  seed: 42
  batch_size: 4
  grad_accumulation_steps: 4
  use_amp: true
  num_train_steps: 50000
  log_interval: 10
  save_interval: 5000
  learning_rate: 5e-6  # OpenPI/OpenVLA use 5e-5~5e-4; try 1e-4 for faster convergence
  weight_decay: 0
  num_workers: 8
  resume: true
  resume_from_best: true  # load best/ (step 7256) instead of latest step dir
  overwrite: false
  grad_clip_norm: 1.0
  # LR schedule (OpenPI-style): warmup + cosine decay
  warmup_steps: 1000
  lr_schedule: cosine_warmup
  end_lr: 1e-5

data:
  repo_id: physical-intelligence/libero
  split: train
  num_workers: 8
  max_token_len: 128
  max_samples: null
  state_dim: 8
  norm_stats_path: assets/physical-intelligence/libero/norm_stats.json  # run compute_norm_stats.py first

model:
  action_dim: 7
  action_horizon: 10
  state_dim: 8  # for OpenPI-style action head state_proj
  gripper_loss_weight: 5.0  # Weight for gripper dim (1.0=no weighting; 3-5 helps binary gripper)
  freeze_vision: true  # saves ~3GB (no opt state); vision uses penultimate layer, last blocks unused
  freeze_language: false
  freeze_vggt: false
  use_lora: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "up_proj", "down_proj", "gate_proj"]
  lora_target_modules_vggt: ["qkv", "proj", "fc1", "fc2"]
  lora_on_language: true
  lora_on_vggt: true
  vision:
    dino_model_name: vit_large_patch14_reg4_dinov2.lvd142m
    siglip_model_name: vit_so400m_patch14_siglip_224
    image_size: 224
  language:
    model_name: Qwen/Qwen3-0.6B-Base
    trust_remote_code: true
  vggt:
    model_name: facebook/VGGT-1B
    trust_remote_code: true
